name: release
# Publishes a release when a vX.Y.Z tag is pushed. The full test suite runs
# first: if anything fails, there is no release.
#
# Works unmodified on GitHub and Forgejo/Gitea:
#   - On GitHub, goreleaser uses .goreleaser.yaml and publishes with the
#     automatic GITHUB_TOKEN.
#   - On Forgejo/Gitea, it uses the .goreleaser-forgejo.yaml overlay
#     (publishes to the self-hosted instance) with the token the forge
#     injects automatically as secrets.GITHUB_TOKEN. No user-defined
#     secrets are required on either platform.
#
# goreleaser is installed directly instead of through the
# goreleaser/goreleaser-action action: that action does not exist on
# data.forgejo.org (the DEFAULT_ACTIONS_URL of typical Forgejo instances),
# so its use would break every Forgejo run. Each release step exports ONLY
# the token its target needs: goreleaser aborts when more than one token
# variable is defined at once.
on:
  push:
    tags:
      - "v*"

# The automatic GITHUB_TOKEN needs write access to create the release and
# upload artifacts (otherwise: 403 Resource not accessible by integration).
# Forgejo ignores this key, which is fine: its run tokens are not scoped
# down by default.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser builds the changelog from git history

      - name: Install docker client
        run: |
          command -v docker >/dev/null 2>&1 && exit 0
          apt-get update && apt-get install -y --no-install-recommends docker.io

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Full test suite
        run: |
          make build test
          make test-integration

      - name: Install goreleaser
        run: |
          case $(uname -m) in
            x86_64)  ga=x86_64 ;;
            aarch64) ga=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          base=https://github.com/goreleaser/goreleaser/releases/latest/download
          mkdir -p /tmp/goreleaser-bin && cd /tmp/goreleaser-bin
          # Keep the original asset name: checksums.txt refers to it.
          curl -fsSL "$base/goreleaser_Linux_${ga}.tar.gz" -o "goreleaser_Linux_${ga}.tar.gz"
          curl -fsSL "$base/checksums.txt" -o checksums.txt
          grep "goreleaser_Linux_${ga}.tar.gz\$" checksums.txt | sha256sum -c -
          # Extract straight into /tmp: the release steps below invoke
          # /tmp/goreleaser by its absolute path.
          tar xzf "goreleaser_Linux_${ga}.tar.gz" -C /tmp goreleaser
          /tmp/goreleaser --version

      - name: Release with goreleaser (GitHub)
        if: startsWith(github.server_url, 'https://github.com')
        run: /tmp/goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release with goreleaser (Forgejo/Gitea)
        if: "!startsWith(github.server_url, 'https://github.com')"
        run: /tmp/goreleaser release --clean --config .goreleaser-forgejo.yaml
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}

