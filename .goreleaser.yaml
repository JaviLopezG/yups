version: 2

project_name: yups

before:
  hooks:
    - go vet ./...

builds:
  - id: yups
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X yups/internal/app.Version={{ .Tag }}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publishing target: with no gitea_urls block, goreleaser publishes to
# GitHub using the automatic GITHUB_TOKEN. Releases made from the
# self-hosted Forgejo instance use the .goreleaser-forgejo.yaml overlay,
# which adds a gitea_urls block on top of this file (see
# .github/workflows/release.yml).
