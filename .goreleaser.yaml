version: 2

project_name: yups

before:
  hooks:
    - go vet ./...

builds:
  - id: yups
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X yups/internal/app.Version={{ .Tag }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publishing target: with no gitea_urls block, goreleaser publishes to
# GitHub using the automatic GITHUB_TOKEN. Releases made from the
# self-hosted Forgejo instance use .goreleaser-forgejo.yaml instead, which
# duplicates this file and adds a gitea_urls block on top of it (see
# .github/workflows/release.yml). Keep both files in sync when editing:
# goreleaser's `includes` feature is Pro-only, so they cannot reference
# each other.
